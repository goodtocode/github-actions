name: 'Workload Digital Product App CI/CD'

# One pipeline for web, API and SQL migrations. Turn components on or off with HAS_WEB, HAS_API and HAS_SQL.
# CI builds and tests once; CD deploys development first, then production behind the
# 'production' environment's required reviewers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/workload-digitalproduct-app.yml
      - src/**
      - .github/scripts/cd/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/workload-digitalproduct-app.yml
      - src/**
      - .github/scripts/cd/**
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        type: choice
        options:
          - development
          - production
          - all
        required: true
        default: "development"
      runcd:
        description: "Run CD pipeline"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  # ===== EDIT PER INSTALL: naming slots (names: {product}-{env}-{region}-{instance}-{type}) =====
  PRODUCT: "PRODUCT"
  REGION: "wus2"
  INSTANCE: "001"
  # Exact deployment name written by the IaC workflow; app/SQL/monitoring targets come from its outputs.
  IAC_DEPLOYMENT_NAME: "workload-digitalproduct"
  AZURE_RESOURCE_GROUP_NAME: "" # Match IaC when overriding its naming slots.
  BACKEND_API_BASE_URL: "" # Required only for web-only deployments.
  # Components that exist in this repo. HAS_E2E runs the end-to-end tests against the deployed API.
  HAS_WEB: "true"
  HAS_API: "true"
  HAS_SQL: "true"
  HAS_E2E: "false"
  # ==============================================================================================================
  API_ARTIFACT_OUTPUT: 'publish_output'
  WEB_ARTIFACT_OUTPUT: 'publish_web_output'
  API_ARTIFACT_NAME: 'api-artifact'
  WEB_ARTIFACT_NAME: 'web-artifact'
  MIGRATION_ARTIFACT_NAME: 'ef-migrations'
  MIGRATION_ARTIFACT_PATH: 'ef-migrations.sql'
  MIGRATION_ARTIFACT_OUTPUT_PATH: './'
  CODEQL_ON_PRIVATE: "false"
  EEID_VALIDATE_AUTHORITY: "true"

jobs:
  ci:
    name: "App CI"
    runs-on: ubuntu-latest
    # Test secrets (the Azure OpenAI endpoint and key) are read from the development environment.
    environment: development
    strategy:
      matrix:
        DOTNET_VERSION: ["10.x"]
    env:
      SCRIPTS_PATH: "./.github/scripts"
      SRC_PATH: "./src"
      SRC_SLN: "COMPANY.PRODUCT.slnx"
      API_PATH: "Presentation.Api"
      API_PROJECT: "Presentation.Api.csproj"
      TEST_PATH: "Tests.Integration"
      TEST_PROJECT: "Tests.Integration.csproj"
      WEB_PATH: "Presentation.Web"
      WEB_PROJECT: "Presentation.Web.csproj"
      INFRA_PATH: 'Infrastructure.SqlServer'
      INFRA_PROJECT: 'Infrastructure.SqlServer.csproj'
      INFRA_DBCONTEXT: 'PRODUCTContext'
      RUNTIME_ENV: "Development"
      CONFIGURATION: "Release"
      VERSION_MAJOR: '1'
      VERSION_MINOR: '1'

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: dotnet version ${{ matrix.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Get Semantic Version
        id: get_version
        run: |
          $json = & "${{ env.SCRIPTS_PATH }}/ci/Get-Version.ps1" -Major ${{ env.VERSION_MAJOR }} -Minor ${{ env.VERSION_MINOR }} -Patch $env:GITHUB_RUN_NUMBER
          $versionObj = ($json | ConvertFrom-Json)
          echo "SEMANTIC_VERSION=$($versionObj.SemanticVersion)" >> $env:GITHUB_OUTPUT
          echo "FILE_VERSION=$($versionObj.FileVersion)" >> $env:GITHUB_OUTPUT
          echo "ASSEMBLY_VERSION=$($versionObj.AssemblyVersion)" >> $env:GITHUB_OUTPUT
          echo "INFORMATIONAL_VERSION=$($versionObj.InformationalVersion)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set-Version.ps1
        run: |
          $version = ${{ env.SCRIPTS_PATH }}/ci/Set-Version.ps1 -Path ${{ env.SRC_PATH }} -VersionToReplace 1.0.0 -Major ${{ env.VERSION_MAJOR }} -Minor ${{ env.VERSION_MINOR }} -Patch $env:GITHUB_RUN_NUMBER
          echo $version
          echo "VERSION=$version" >> $GITHUB_ENV
        shell: pwsh

      - name: pipeline environment configuration
        run: |
          echo "ASPNETCORE_ENVIRONMENT=${{ env.RUNTIME_ENV }}" >> $GITHUB_ENV
        shell: pwsh

      - name: Configure AI credentials for tests only
        if: env.HAS_API == 'true'
        shell: pwsh
        run: |
          "AzureOpenAI__Endpoint=$env:AZURE_OPENAI_ENDPOINT" >> $env:GITHUB_ENV
          "AzureOpenAI__ApiKey=$env:AZURE_OPENAI_APIKEY" >> $env:GITHUB_ENV
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_APIKEY: ${{ secrets.AZURE_OPENAI_APIKEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build (warnings as errors)
        run: dotnet build ${{ env.SRC_SLN }} --configuration ${{ env.CONFIGURATION }}
        shell: pwsh

      - name: Install dotnet-ef
        if: env.HAS_SQL == 'true'
        run: |
          dotnet tool install --global dotnet-ef
          echo "$env:HOME/.dotnet/tools" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Check for uncommitted EF Core model changes
        if: env.HAS_SQL == 'true' && github.event_name == 'pull_request'
        run: |
          $tempDir = "${{ env.SRC_PATH }}/${{ env.INFRA_PATH }}/.temp-migrations"
          if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir }
          dotnet ef migrations add TempCheck --project ${{ env.SRC_PATH }}/${{ env.INFRA_PATH }}/${{ env.INFRA_PROJECT }} --startup-project ${{ env.SRC_PATH }}/${{ env.API_PATH }}/${{ env.API_PROJECT }} --context ${{ env.INFRA_DBCONTEXT }} --output-dir $tempDir --configuration ${{ env.CONFIGURATION }} --no-build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::dotnet ef migrations add failed."
            exit 1
          }
          if (Test-Path $tempDir) {
            $files = Get-ChildItem -Path $tempDir
            if ($files) {
              Write-Host "::error::Uncommitted model changes detected. Run 'dotnet ef migrations add' locally and commit the migration files."
              Remove-Item -Recurse -Force $tempDir
              exit 1
            }
            Remove-Item -Recurse -Force $tempDir
          }
        shell: pwsh

      - name: Create ${{ env.INFRA_DBCONTEXT }} SQL script
        if: env.HAS_SQL == 'true'
        run: |
          dotnet ef migrations script --project ${{ env.SRC_PATH }}/${{ env.INFRA_PATH }}/${{ env.INFRA_PROJECT }} --startup-project ${{ env.SRC_PATH }}/${{ env.API_PATH }}/${{ env.API_PROJECT }} --context ${{ env.INFRA_DBCONTEXT }} --output ${{ env.MIGRATION_ARTIFACT_PATH }} --idempotent --configuration ${{ env.CONFIGURATION }} --no-build
        shell: pwsh

      - name: Upload migration script
        if: env.HAS_SQL == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MIGRATION_ARTIFACT_NAME }}
          path: ${{ env.MIGRATION_ARTIFACT_PATH }}

      - name: Test
        run: dotnet test ${{ env.SRC_PATH }}/${{ env.TEST_PATH }}/${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test-results.trx" --results-directory "${{ env.SRC_PATH }}/TestResults"
        shell: pwsh

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-results-${{ matrix.DOTNET_VERSION }}
          path: ${{ env.SRC_PATH }}/TestResults

      - name: Pack Web API artifact
        if: env.HAS_API == 'true'
        run: |
          dotnet publish ${{ env.SRC_PATH }}/${{ env.API_PATH }}/${{ env.API_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.API_ARTIFACT_OUTPUT }}
        shell: pwsh

      - name: Upload Web API artifact
        if: env.HAS_API == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_ARTIFACT_NAME }}
          path: ${{ env.API_ARTIFACT_OUTPUT }}/**

      - name: Pack Blazor artifact
        if: env.HAS_WEB == 'true'
        run: |
          dotnet publish ${{ env.SRC_PATH }}/${{ env.WEB_PATH }}/${{ env.WEB_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.WEB_ARTIFACT_OUTPUT }}
        shell: pwsh

      - name: Upload Blazor artifact
        if: env.HAS_WEB == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.WEB_ARTIFACT_OUTPUT }}/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        if: ${{ env.CODEQL_ON_PRIVATE == 'true' || !github.event.repository.private }}

  plan:
    name: "Select environments"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_RUNCD: ${{ github.event.inputs.runcd }}
        run: |
          dev='{"environment":"development","rgenv":"dev","runtime":"Development"}'
          prod='{"environment":"production","rgenv":"prod","runtime":"Production"}'
          deploy=false
          case "$EVENT_NAME" in
            pull_request) list="$dev" ;;
            push)
              list="$dev,$prod"
              [ "$REF" = "refs/heads/main" ] && deploy=true
              ;;
            *)
              case "$INPUT_ENVIRONMENT" in
                production) list="$prod" ;;
                all) list="$dev,$prod" ;;
                *) list="$dev" ;;
              esac
              [ "$INPUT_RUNCD" = "true" ] && deploy=true
              ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Single-environment users: remove the unused entry from the plan step above.
  cd:
    name: "App CD (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: [ci, plan]
    if: needs.plan.outputs.deploy == 'true'
    environment: ${{ matrix.environment }}
    concurrency:
      group: workload-deployment-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RUNTIME_ENV: ${{ matrix.runtime }}
      DOTNET_VERSION: "10.x"
      SRC_PATH: "./src"
      E2E_PATH: "Tests.Endtoend"
      E2E_PROJECT: "Tests.Endtoend.csproj"
      CONFIGURATION: "Release"

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7

      # Hard-code any name here if it does not follow the slot pattern.
      - name: Resolve names
        shell: bash
        env:
          RESOURCE_GROUP_OVERRIDE: ${{ env.AZURE_RESOURCE_GROUP_NAME }}
        run: |
          prefix="${PRODUCT}-${{ matrix.rgenv }}-${REGION}-${INSTANCE}"
          {
            echo "AZURE_RG_NAME=${RESOURCE_GROUP_OVERRIDE:-${prefix}-rg}"
          } >> "$GITHUB_ENV"

      - name: Download Web API artifact
        if: env.HAS_API == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.API_ARTIFACT_NAME }}
          path: ${{ env.API_ARTIFACT_OUTPUT }}

      - name: Download Web artifact
        if: env.HAS_WEB == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ env.WEB_ARTIFACT_OUTPUT }}

      - name: Download migration script
        if: env.HAS_SQL == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MIGRATION_ARTIFACT_NAME }}
          path: ${{ env.MIGRATION_ARTIFACT_OUTPUT_PATH }}

      - name: az login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read exact infrastructure deployment targets
        shell: pwsh
        run: |
          $targets = & ./.github/scripts/cd/Get-WorkloadDeployment.ps1 -ResourceGroupName $env:AZURE_RG_NAME -DeploymentName $env:IAC_DEPLOYMENT_NAME
          if ($env:HAS_API -eq 'true' -and (-not $targets.apiAppName -or -not $targets.apiEndpoint)) { throw "API component is not deployed." }
          if ($env:HAS_WEB -eq 'true' -and -not $targets.webAppName) { throw "Web component is not deployed." }
          if ($env:HAS_SQL -eq 'true') {
            if (-not $targets.sqlServerHost -or -not $targets.sqlDatabaseName) { throw "SQL component is not deployed." }
            if ($targets.sqlServerKind -notin @('EntraOnly', 'Existing')) { throw "SQL deployment must use the Entra-only workload contract." }
            if ($env:HAS_API -eq 'true' -and -not $targets.apiManagedIdentityClientId) { throw "Configure the API user-assigned identity before selecting managed-identity SQL access." }
          }
          "AZURE_APIAPP_NAME=$($targets.apiAppName)" >> $env:GITHUB_ENV
          "AZURE_WEBAPP_NAME=$($targets.webAppName)" >> $env:GITHUB_ENV
          "API_BASE_URL=$($targets.apiEndpoint)" >> $env:GITHUB_ENV
          "APPLICATION_INSIGHTS_RESOURCE_ID=$($targets.applicationInsightsResourceId)" >> $env:GITHUB_ENV
          "SQL_SERVER_HOST=$($targets.sqlServerHost)" >> $env:GITHUB_ENV
          "SQLDB_NAME=$($targets.sqlDatabaseName)" >> $env:GITHUB_ENV
          "API_MANAGED_IDENTITY_CLIENT_ID=$($targets.apiManagedIdentityClientId)" >> $env:GITHUB_ENV

      - name: Deploy SQL script
        if: env.HAS_SQL == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable SqlServer | Where-Object { $_.Version -ge [version]'22.0' })) {
            Install-Module SqlServer -MinimumVersion 22.0 -Scope CurrentUser -Force
          }
          & ./.github/scripts/cd/Invoke-AzureSqlMigration.ps1 -ServerHost $env:SQL_SERVER_HOST -DatabaseName $env:SQLDB_NAME -ScriptPath $env:MIGRATION_ARTIFACT_PATH

      - name: ${{ env.AZURE_APIAPP_NAME }} app settings
        if: env.HAS_API == 'true'
        env:
          EEID_TENANT_ID: ${{ secrets.EEID_TENANT_ID }}
          EEID_INSTANCE: ${{ secrets.EEID_INSTANCE }}
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_APIKEY: ${{ secrets.AZURE_OPENAI_APIKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $TEMP_JSON = az resource show --ids $env:APPLICATION_INSIGHTS_RESOURCE_ID --api-version 2020-02-02 --query properties | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Application Insights." }
          $INSTR_KEY = $TEMP_JSON.instrumentationKey
          $CONN_STR = $TEMP_JSON.connectionString
          if (-not $INSTR_KEY -or -not $CONN_STR) { throw "Application Insights settings are missing." }
          $settings = @(
            "APPINSIGHTS_INSTRUMENTATIONKEY=$INSTR_KEY",
            "APPLICATIONINSIGHTS_CONNECTION_STRING=$CONN_STR",
            "ASPNETCORE_ENVIRONMENT=$env:RUNTIME_ENV",
            "EntraExternalId:Instance=$env:EEID_INSTANCE",
            "EntraExternalId:TenantId=$env:EEID_TENANT_ID",
            "EntraExternalId:ClientId=$env:API_CLIENT_ID",
            "EntraExternalId:ValidateAuthority=$env:EEID_VALIDATE_AUTHORITY",
            "AzureOpenAI:Endpoint=$env:AZURE_OPENAI_ENDPOINT",
            "AzureOpenAI:ApiKey=$env:AZURE_OPENAI_APIKEY"
          )
          az webapp config appsettings set -g $env:AZURE_RG_NAME -n $env:AZURE_APIAPP_NAME --settings @settings --output none
        shell: pwsh

      - name: ${{ env.AZURE_APIAPP_NAME }} connection strings
        if: env.HAS_API == 'true' && env.HAS_SQL == 'true'
        run: |
          $connection = [System.Data.Common.DbConnectionStringBuilder]::new()
          $connection['Server'] = "tcp:$env:SQL_SERVER_HOST,1433"
          $connection['Database'] = $env:SQLDB_NAME
          $connection['Authentication'] = 'Active Directory Managed Identity'
          $connection['User Id'] = $env:API_MANAGED_IDENTITY_CLIENT_ID
          $connection['Encrypt'] = 'True'
          $connection['TrustServerCertificate'] = 'False'
          az webapp config connection-string set -g $env:AZURE_RG_NAME -n $env:AZURE_APIAPP_NAME -t SQLServer --settings "DefaultConnection=$($connection.ConnectionString)" --output none
          if ($LASTEXITCODE -ne 0) { throw "Unable to configure managed-identity SQL access." }
        shell: pwsh

      - name: Deploy ${{ env.AZURE_APIAPP_NAME }}
        if: env.HAS_API == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_APIAPP_NAME }}
          package: ${{ env.API_ARTIFACT_OUTPUT }}

      - name: ${{ env.AZURE_WEBAPP_NAME }} app settings
        if: env.HAS_WEB == 'true'
        env:
          EEID_TENANT_ID: ${{ secrets.EEID_TENANT_ID }}
          EEID_INSTANCE: ${{ secrets.EEID_INSTANCE }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          WEB_CLIENT_SECRET: ${{ secrets.WEB_CLIENT_SECRET }}
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          BACKEND_API_BASE_URL: ${{ env.BACKEND_API_BASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $TEMP_JSON = az resource show --ids $env:APPLICATION_INSIGHTS_RESOURCE_ID --api-version 2020-02-02 --query properties | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Application Insights." }
          $INSTR_KEY = $TEMP_JSON.instrumentationKey
          $CONN_STR = $TEMP_JSON.connectionString
          if (-not $INSTR_KEY -or -not $CONN_STR) { throw "Application Insights settings are missing." }
          $backendUrl = if ($env:HAS_API -eq 'true') { $env:API_BASE_URL } else { $env:BACKEND_API_BASE_URL }
          $uri = $null
          if (-not [uri]::TryCreate($backendUrl, [UriKind]::Absolute, [ref]$uri) -or $uri.Scheme -ne 'https') {
            throw "Configure BACKEND_API_BASE_URL for a web-only deployment."
          }
          $settings = @(
            "APPINSIGHTS_INSTRUMENTATIONKEY=$INSTR_KEY",
            "APPLICATIONINSIGHTS_CONNECTION_STRING=$CONN_STR",
            "ASPNETCORE_ENVIRONMENT=$env:RUNTIME_ENV",
            "EntraExternalId:Instance=$env:EEID_INSTANCE",
            "EntraExternalId:TenantId=$env:EEID_TENANT_ID",
            "EntraExternalId:ClientId=$env:WEB_CLIENT_ID",
            "EntraExternalId:ClientSecret=$env:WEB_CLIENT_SECRET",
            "EntraExternalId:ValidateAuthority=$env:EEID_VALIDATE_AUTHORITY",
            "BackendApi:BaseUrl=$backendUrl",
            "BackendApi:ClientId=$env:API_CLIENT_ID"
          )
          az webapp config appsettings set -g $env:AZURE_RG_NAME -n $env:AZURE_WEBAPP_NAME --settings @settings --output none
        shell: pwsh

      - name: Deploy ${{ env.AZURE_WEBAPP_NAME }}
        if: env.HAS_WEB == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.WEB_ARTIFACT_OUTPUT }}

      - name: dotnet version ${{ env.DOTNET_VERSION }}
        if: env.HAS_E2E == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run E2E tests against ${{ env.AZURE_APIAPP_NAME }}
        if: env.HAS_E2E == 'true'
        run: dotnet test ${{ env.SRC_PATH }}/${{ env.E2E_PATH }}/${{ env.E2E_PROJECT }} --configuration ${{ env.CONFIGURATION }}
        shell: pwsh
        env:
          BackendApi__BaseUrl: ${{ env.API_BASE_URL }}
          BackendApi__ClientId: ${{ secrets.API_CLIENT_ID }}
          EntraExternalId__Instance: ${{ secrets.EEID_INSTANCE }}
          EntraExternalId__TenantId: ${{ secrets.EEID_TENANT_ID }}
          EntraExternalId__ClientId: ${{ secrets.E2E_CLIENT_ID }}
          EntraExternalId__ClientSecret: ${{ secrets.E2E_CLIENT_SECRET }}
          EntraExternalId__ValidateAuthority: "true"

      - name: Upload E2E test results
        if: ${{ always() && env.HAS_E2E == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: ${{ env.SRC_PATH }}/TestResults/E2E
