name: 'Platform Spoke AOAI IaC'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/COMPANY-platform-standalone-aoai-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
      - .azure/**/*.bicepparams
  push:
    branches:
      - main
    paths:
      - .github/workflows/COMPANY-platform-standalone-aoai-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
      - .azure/**/*.bicepparams
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        type: choice
        options:
          - development
          - production
        required: true
        default: "development"
      runcd:
        description: "Run CD pipeline"
        required: true
        default: "false"

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"
  SPOKE_LOCATION: "westus2"
  SPOKE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
  SPOKE_AI_RG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && 'COMPANY-spoke-ai-prod-wus2-001-rg' || 'COMPANY-spoke-ai-dev-wus2-001-rg' }}
  SPOKE_AI_BICEP_TEMPLATE: ".azure/templates/platform-standalone-ai-aoai.bicep"
  SPOKE_AI_BICEP_PARAMETERS_DEV: ".azure/variables/platform-standalone-ai-aoai-dev.bicepparam"
  SPOKE_AI_BICEP_PARAMETERS_PROD: ".azure/variables/platform-standalone-ai-aoai-prod.bicepparam"
  SPOKE_AI_BICEP_PARAMETERS_SELECTED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && '.azure/variables/platform-standalone-ai-aoai-prod.bicepparam' || '.azure/variables/platform-standalone-ai-aoai-dev.bicepparam' }}
  SPOKE_AI_MODEL_NAME: "gpt-5.6-luna"
  
permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  ci:
    name: "Validate spoke AOAI IaC"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Az CLI login"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ${{ env.SPOKE_AI_RG_NAME }}
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az group create -n ${{ env.SPOKE_AI_RG_NAME }} -l ${{ env.SPOKE_LOCATION }}

      - name: "[SPOKE_AI] Validate Azure OpenAI deployment in ${{ env.SPOKE_AI_RG_NAME }}"
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if --resource-group ${{ env.SPOKE_AI_RG_NAME }} --template-file ${{ env.SPOKE_AI_BICEP_TEMPLATE }} --parameters ${{ env.SPOKE_AI_BICEP_PARAMETERS_SELECTED }} --parameters modelName=${{ env.SPOKE_AI_MODEL_NAME }}

  cd:
    name: "Deploy standalone AOAI IaC"
    runs-on: ubuntu-latest
    needs: ci
    if: |
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.runcd == 'true' || github.event.inputs.runcd == true))
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Az CLI login"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ${{ env.SPOKE_AI_RG_NAME }}
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az group create -n ${{ env.SPOKE_AI_RG_NAME }} -l ${{ env.SPOKE_LOCATION }}

      - name: "[SPOKE_AI] Deploy Azure OpenAI to ${{ env.SPOKE_AI_RG_NAME }}"
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az deployment group create --name spoke-ai-aoai --resource-group ${{ env.SPOKE_AI_RG_NAME }} --template-file ${{ env.SPOKE_AI_BICEP_TEMPLATE }} --parameters ${{ env.SPOKE_AI_BICEP_PARAMETERS_SELECTED }} --parameters modelName=${{ env.SPOKE_AI_MODEL_NAME }}