name: 'Platform Mgmt IaC'

# Phase 2: shared management (workspace, App Insights, Key Vault, App Configuration, App Service plan)
# in the development and production subscriptions. No hub, spoke or VNet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/platform-shared-mgmt-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
  push:
    branches:
      - main
    paths:
      - .github/workflows/platform-shared-mgmt-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        type: choice
        options:
          - development
          - production
          - all
        required: true
        default: "development"
      runcd:
        description: "Run CD pipeline"
        required: true
        default: "false"

env:
  # ===== EDIT PER INSTALL: naming slots (RG: {product}-{env}-{region}-{instance}-rg) =====
  PRODUCT: "mgmt"
  REGION: "wus2"
  INSTANCE: "001"
  LOCATION: "westus2"
  # ===============================================================================================
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"
  MGMT_BICEP_TEMPLATE: ".azure/templates/platform-shared-mgmt.bicep"

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  plan:
    name: "Select environments"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_RUNCD: ${{ github.event.inputs.runcd }}
        run: |
          dev='{"environment":"development","short":"dev","rgenv":"dev"}'
          prod='{"environment":"production","short":"prod","rgenv":"prod"}'
          deploy=false
          case "$EVENT_NAME" in
            pull_request) list="$dev" ;;
            push) list="$dev,$prod"; deploy=true ;;
            *)
              case "$INPUT_ENVIRONMENT" in
                production) list="$prod" ;;
                all) list="$dev,$prod" ;;
                *) list="$dev" ;;
              esac
              [ "$INPUT_RUNCD" = "true" ] && deploy=true
              ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Development runs first; required reviewers on the GitHub 'production' environment gate production.
  # Single-environment users: remove the unused entry from the plan step above.
  mgmt:
    name: "Mgmt IaC (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MGMT_BICEP_PARAMETERS: .azure/variables/platform-shared-mgmt-${{ matrix.short }}.bicepparam
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hard-code the resource group name here if it does not follow the slot pattern.
      - name: Resolve resource group name
        shell: bash
        run: echo "MGMT_RG_NAME=${PRODUCT}-${{ matrix.rgenv }}-${REGION}-${INSTANCE}-rg" >> "$GITHUB_ENV"

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ${{ env.MGMT_RG_NAME }}
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az group create -n ${{ env.MGMT_RG_NAME }} -l ${{ env.LOCATION }}

      - name: Validate ${{ env.MGMT_RG_NAME }}
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az deployment group what-if --resource-group ${{ env.MGMT_RG_NAME }} --template-file ${{ env.MGMT_BICEP_TEMPLATE }} --parameters ${{ env.MGMT_BICEP_PARAMETERS }}

      - name: Deploy ${{ env.MGMT_RG_NAME }}
        if: needs.plan.outputs.deploy == 'true'
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az deployment group create --resource-group ${{ env.MGMT_RG_NAME }} --template-file ${{ env.MGMT_BICEP_TEMPLATE }} --parameters ${{ env.MGMT_BICEP_PARAMETERS }}
