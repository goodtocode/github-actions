name: 'Platform AI IaC'

# Azure AI for a product, deployed into the product's own resource group (Phase 2 recommendation).
# AI_VARIANT picks the template and parameter files: shared-ai-foundry | shared-ai-ollama | spoke-ai-foundry | spoke-ai-ollama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/platform-ai-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
  push:
    branches:
      - main
    paths:
      - .github/workflows/platform-ai-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        type: choice
        options:
          - development
          - production
          - all
        required: true
        default: "development"
      runcd:
        description: "Run CD pipeline"
        required: true
        default: "false"

env:
  # ===== EDIT PER INSTALL: naming slots (RG: {product/purpose}-{env}-{region}-{instance}-rg) =====
  PRODUCT: "PRODUCT"
  REGION: "wus2"
  INSTANCE: "001"
  LOCATION: "westus2"
  AI_VARIANT: "shared-ai-foundry"
  # Optional model override passed as --parameters modelName=...; leave empty to use the parameter file.
  AI_MODEL_NAME: ""
  # ===============================================================================================
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  plan:
    name: "Select environments"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_RUNCD: ${{ github.event.inputs.runcd }}
        run: |
          dev='{"environment":"development","short":"dev","rgenv":"dev"}'
          prod='{"environment":"production","short":"prod","rgenv":"prod"}'
          deploy=false
          case "$EVENT_NAME" in
            pull_request) list="$dev" ;;
            push) list="$dev,$prod"; deploy=true ;;
            *)
              case "$INPUT_ENVIRONMENT" in
                production) list="$prod" ;;
                all) list="$dev,$prod" ;;
                *) list="$dev" ;;
              esac
              [ "$INPUT_RUNCD" = "true" ] && deploy=true
              ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  ai:
    name: "AI IaC (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hard-code the resource group name here if it does not follow the slot pattern.
      - name: Resolve names
        shell: bash
        run: |
          {
            echo "AI_RG_NAME=${PRODUCT}-${{ matrix.rgenv }}-${REGION}-${INSTANCE}-rg"
            echo "AI_BICEP_TEMPLATE=.azure/templates/platform-${AI_VARIANT}.bicep"
            echo "AI_BICEP_PARAMETERS=.azure/variables/platform-${AI_VARIANT}-${{ matrix.short }}.bicepparam"
            if [ -n "$AI_MODEL_NAME" ]; then echo "AI_MODEL_ARGS=--parameters modelName=$AI_MODEL_NAME"; else echo "AI_MODEL_ARGS="; fi
          } >> "$GITHUB_ENV"

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ${{ env.AI_RG_NAME }}
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az group create -n ${{ env.AI_RG_NAME }} -l ${{ env.LOCATION }}

      - name: Validate ${{ env.AI_VARIANT }} in ${{ env.AI_RG_NAME }}
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az deployment group what-if --resource-group ${{ env.AI_RG_NAME }} --template-file ${{ env.AI_BICEP_TEMPLATE }} --parameters ${{ env.AI_BICEP_PARAMETERS }} ${{ env.AI_MODEL_ARGS }}

      - name: Deploy ${{ env.AI_VARIANT }} to ${{ env.AI_RG_NAME }}
        if: needs.plan.outputs.deploy == 'true'
        uses: Azure/cli@v3
        with:
          inlineScript: |
            az deployment group create --name ${{ env.AI_VARIANT }} --resource-group ${{ env.AI_RG_NAME }} --template-file ${{ env.AI_BICEP_TEMPLATE }} --parameters ${{ env.AI_BICEP_PARAMETERS }} ${{ env.AI_MODEL_ARGS }}
