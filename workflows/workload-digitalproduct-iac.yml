name: 'Workload Digital Product IaC'

# One pipeline for every mode and phase. The mode picks the parameter file; the environment matrix
# runs development first, then production behind the 'production' environment's required reviewers.
# Private-endpoint mode requires runner connectivity to its private services; shared/standalone do not require a VNet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/workload-digitalproduct-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
      - .github/scripts/cd/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/workload-digitalproduct-iac.yml
      - .azure/**/*.bicep
      - .azure/**/*.bicepparam
      - .github/scripts/cd/**
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        type: choice
        options:
          - development
          - production
          - all
        required: true
        default: "development"
      runcd:
        description: "Run CD pipeline"
        required: true
        default: "false"

env:
  # ===== EDIT PER INSTALL: naming slots (RG: {product}-{env}-{region}-{instance}-rg) =====
  PRODUCT: "PRODUCT"
  REGION: "wus2"
  INSTANCE: "001"
  LOCATION: "westus2"
  # standalone | shared | network | zerotrust
  MODE: "shared"
  IAC_DEPLOYMENT_NAME: "workload-digitalproduct"
  AZURE_RESOURCE_GROUP_NAME: "" # Optional explicit RG; otherwise naming slots above.
  SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: "" # Set here or in the GitHub environment secret.
  # ===============================================================================================
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  plan:
    name: "Select environments"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_RUNCD: ${{ github.event.inputs.runcd }}
        run: |
          dev='{"environment":"development","short":"dev","rgenv":"dev"}'
          prod='{"environment":"production","short":"prod","rgenv":"prod"}'
          deploy=false
          case "$EVENT_NAME" in
            pull_request) list="$dev" ;;
            push) list="$dev,$prod"; deploy=true ;;
            *)
              case "$INPUT_ENVIRONMENT" in
                production) list="$prod" ;;
                all) list="$dev,$prod" ;;
                *) list="$dev" ;;
              esac
              [ "$INPUT_RUNCD" = "true" ] && deploy=true
              ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Single-environment users: remove the unused entry from the plan step above.
  product:
    name: "Product IaC (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ matrix.environment }}
    concurrency:
      group: workload-deployment-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hard-code the resource group name here if it does not follow the slot pattern.
      - name: Resolve names
        shell: bash
        env:
          RESOURCE_GROUP_OVERRIDE: ${{ env.AZURE_RESOURCE_GROUP_NAME }}
        run: |
          {
            echo "PRODUCT_RG_NAME=${RESOURCE_GROUP_OVERRIDE:-${PRODUCT}-${{ matrix.rgenv }}-${REGION}-${INSTANCE}-rg}"
            if [ "$MODE" = "zerotrust" ]; then
              echo "PRODUCT_BICEP_TEMPLATE=.azure/templates/workload-digitalproduct-zerotrust.bicep"
            else
              echo "PRODUCT_BICEP_TEMPLATE=.azure/templates/workload-digitalproduct.bicep"
            fi
            echo "PRODUCT_BICEP_PARAMETERS=.azure/variables/workload-digitalproduct-${MODE}-${{ matrix.short }}.bicepparam"
          } >> "$GITHUB_ENV"

      - name: Compile workload contract and parameters
        shell: pwsh
        env:
          SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: "00000000-0000-0000-0000-000000000000"
          AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
        run: |
          az bicep build --stdout --file $env:PRODUCT_BICEP_TEMPLATE | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Workload template compilation failed." }
          az bicep build-params --stdout --file $env:PRODUCT_BICEP_PARAMETERS | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Workload parameter compilation failed." }

      - name: Check Entra-only SQL administrator inputs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID || env.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SQL_SERVER_AUTHENTICATION: ${{ secrets.SQL_SERVER_AUTHENTICATION }}
        run: |
          $compiled = az bicep build-params --stdout --file $env:PRODUCT_BICEP_PARAMETERS | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Workload parameter compilation failed." }
          $parameters = ($compiled.parametersJson | ConvertFrom-Json).parameters
          if ($parameters.PSObject.Properties['sql'] -and $parameters.sql.value.server.kind -eq 'EntraOnly' -and $env:SQL_SERVER_AUTHENTICATION -ne 'SqlAuth') {
            foreach ($name in @('objectId', 'tenantId')) {
              $id = [guid]::Empty
              if (-not [guid]::TryParse($parameters.sql.value.server.administrator.$name, [ref]$id) -or $id -eq [guid]::Empty) {
                throw "Configure SQL Entra administrator $name with a non-placeholder workload tenant/group ID."
              }
            }
          }

      - name: "Az CLI login"
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select SQL creation or ordinary update
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID || env.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_SERVER_AUTHENTICATION: ${{ secrets.SQL_SERVER_AUTHENTICATION }}
        run: |
          $compiled = az bicep build-params --stdout --file $env:PRODUCT_BICEP_PARAMETERS | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Workload parameter compilation failed." }
          $parameters = ($compiled.parametersJson | ConvertFrom-Json).parameters
          $createServer = $false
          if ($parameters.PSObject.Properties['sql']) {
            $createServer = & ./.github/scripts/cd/Get-WorkloadSqlCreateMode.ps1 -SqlConfiguration $parameters.sql.value -ResourceGroupName $env:PRODUCT_RG_NAME -SubscriptionId $env:AZURE_SUBSCRIPTION_ID
          }
          "SQL_CREATE_SERVER=$($createServer.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Create ${{ env.PRODUCT_RG_NAME }}
        if: needs.plan.outputs.deploy == 'true'
        shell: pwsh
        run: |
          az group create --name $env:PRODUCT_RG_NAME --location $env:LOCATION --output none
          if ($LASTEXITCODE -ne 0) { throw "Resource group creation failed." }

      - name: Validate ${{ env.PRODUCT_RG_NAME }}
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID || env.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_SERVER_AUTHENTICATION: ${{ secrets.SQL_SERVER_AUTHENTICATION }}
        run: |
          az deployment group what-if --resource-group $env:PRODUCT_RG_NAME --template-file $env:PRODUCT_BICEP_TEMPLATE --parameters $env:PRODUCT_BICEP_PARAMETERS "sqlCreateServer=$env:SQL_CREATE_SERVER" "sqlAdministratorPassword=$env:SQL_ADMIN_PASSWORD" "sqlAdministratorLogin=$env:SQL_ADMIN_USER" "sqlAuthentication=$env:SQL_SERVER_AUTHENTICATION"
          if ($LASTEXITCODE -ne 0) { throw "Workload what-if failed." }

      - name: Deploy ${{ env.PRODUCT_RG_NAME }}
        if: needs.plan.outputs.deploy == 'true'
        shell: pwsh
        env:
          SQL_ENTRA_ADMIN_GROUP_OBJECT_ID: ${{ secrets.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID || env.SQL_ENTRA_ADMIN_GROUP_OBJECT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_SERVER_AUTHENTICATION: ${{ secrets.SQL_SERVER_AUTHENTICATION }}
        run: |
          az deployment group create --name $env:IAC_DEPLOYMENT_NAME --resource-group $env:PRODUCT_RG_NAME --template-file $env:PRODUCT_BICEP_TEMPLATE --parameters $env:PRODUCT_BICEP_PARAMETERS "sqlCreateServer=$env:SQL_CREATE_SERVER" "sqlAdministratorPassword=$env:SQL_ADMIN_PASSWORD" "sqlAdministratorLogin=$env:SQL_ADMIN_USER" "sqlAuthentication=$env:SQL_SERVER_AUTHENTICATION" --output none
          if ($LASTEXITCODE -ne 0) { throw "Workload deployment failed." }

      - name: Provision SQL-auth database access
        if: needs.plan.outputs.deploy == 'true'
        shell: pwsh
        env:
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_MIGRATION_USER: ${{ secrets.SQL_MIGRATION_USER }}
          SQL_MIGRATION_PASSWORD: ${{ secrets.SQL_MIGRATION_PASSWORD }}
        run: |
          $targets = & ./.github/scripts/cd/Get-WorkloadDeployment.ps1 -ResourceGroupName $env:PRODUCT_RG_NAME -DeploymentName $env:IAC_DEPLOYMENT_NAME
          if ($targets.sqlServerHost -and $targets.sqlServerKind -eq 'SqlAuth') {
            foreach ($name in @('SQL_ADMIN_USER', 'SQL_ADMIN_PASSWORD', 'SQL_MIGRATION_USER', 'SQL_MIGRATION_PASSWORD')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Configure $name before provisioning SQL-auth access." }
            }
            if (-not (Get-Module -ListAvailable SqlServer | Where-Object { $_.Version -ge [version]'22.0' })) {
              Install-Module SqlServer -MinimumVersion 22.0 -Scope CurrentUser -Force
            }
            $administrator = [pscredential]::new($env:SQL_ADMIN_USER, (ConvertTo-SecureString $env:SQL_ADMIN_PASSWORD -AsPlainText -Force))
            $migration = [pscredential]::new($env:SQL_MIGRATION_USER, (ConvertTo-SecureString $env:SQL_MIGRATION_PASSWORD -AsPlainText -Force))
            & ./.github/scripts/cd/Set-AzureSqlPasswordUsers.ps1 -ServerHost $targets.sqlServerHost -DatabaseName $targets.sqlDatabaseName -Administrator $administrator -Migration $migration -ApiAppName $targets.apiAppName -ResourceGroupName $env:PRODUCT_RG_NAME
          }
